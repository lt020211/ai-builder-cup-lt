# Cloud Run 服务定义
# 用法：
#   1) 先构建并推送镜像到 Artifact Registry
#   2) 替换下面 image 字段与 secretKeyRef 的 name
#   3) gcloud run services replace deploy/service.yaml --region=asia-east1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gpu-waste-auditor
  labels:
    cloud.googleapis.com/location: asia-east1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 180
      containers:
        - image: asia-east1-docker.pkg.dev/PROJECT_ID/REPO/gpu-waste-auditor:latest
          ports:
            - containerPort: 8080
          env:
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
  traffic:
    - percent: 100
      latestRevision: true
